trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # The name of the Service Connection for your Azure Container Registry in Azure DevOps
  dockerRegistryServiceConnection: 'skillsync-acr-conn'
  
  # The name of the Service Connection for your Azure Subscription (ARM) in Azure DevOps
  azureSubscriptionConnection: 'skillsync-azure-conn'
  
  # Azure Container Registry details
  acrName: 'skillsyncacr20260518'
  containerRegistry: 'skillsyncacr20260518.azurecr.io'
  
  # Repositories matching the names in deploy-apps.sh and Dockerfiles
  imageRepositoryBackend: 'backend'
  imageRepositoryFrontend: 'frontend'
  
  # Dockerfile paths
  dockerfilePathBackend: '$(Build.SourcesDirectory)/backend/Dockerfile'
  dockerfilePathFrontend: '$(Build.SourcesDirectory)/frontend/Dockerfile'
  
  # Target Azure Web App Names
  backendWebAppName: 'skillsync-backend-20260518'
  frontendWebAppName: 'skillsync-frontend-20260518'
  
  # Tagging build with build ID
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: 'Build and Push Stage'
  jobs:
  - job: BuildAndPushJob
    displayName: 'Build & Push Docker Images'
    steps:
    # Build and Push Backend Image
    - task: Docker@2
      displayName: 'Build and Push Backend Image'
      inputs:
        command: 'buildAndPush'
        repository: '$(imageRepositoryBackend)'
        dockerfile: '$(dockerfilePathBackend)'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        tags: |
          $(tag)
          latest

    # Build and Push Frontend Image
    - task: Docker@2
      displayName: 'Build and Push Frontend Image'
      inputs:
        command: 'buildAndPush'
        repository: '$(imageRepositoryFrontend)'
        dockerfile: '$(dockerfilePathFrontend)'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: 'Deploy Stage'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployJob
    displayName: 'Deploy Containers to Azure Web Apps'
    steps:
    # Deploy Backend Container to Azure Web App
    - task: AzureWebAppContainer@1
      displayName: 'Deploy Backend App Service'
      inputs:
        azureSubscription: '$(azureSubscriptionConnection)'
        appName: '$(backendWebAppName)'
        containers: '$(containerRegistry)/$(imageRepositoryBackend):$(tag)'

    # Deploy Frontend Container to Azure Web App
    - task: AzureWebAppContainer@1
      displayName: 'Deploy Frontend App Service'
      inputs:
        azureSubscription: '$(azureSubscriptionConnection)'
        appName: '$(frontendWebAppName)'
        containers: '$(containerRegistry)/$(imageRepositoryFrontend):$(tag)'
